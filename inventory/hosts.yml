---
# Static inventory.
#
# When you PROVISION a cloud instance (target != manual), the host is added to
# the `investigator` group automatically at runtime via add_host, so you do not
# need to list it here.
#
# To CONFIGURE a machine you already have (target=manual without an instance_ip,
# or running configure.yml directly), declare it under `investigator` here:
#
# all:
#   children:
#     investigator:
#       hosts:
#         my-existing-box:
#           ansible_host: 203.0.113.10
#           ansible_user: root
#           ansible_ssh_private_key_file: ~/.ssh/id_rsa

all:
  children:
    investigator:
      hosts: {}
